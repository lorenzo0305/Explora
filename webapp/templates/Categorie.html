<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explora — {{ categorie }}</title>

    <link rel="stylesheet" href="/static/styles/app.css">
    <link rel="stylesheet" href="/static/styles/Categorie.css?v=5">
    
    <link rel="stylesheet" href="/static/styles/wishbasket.css?v=6">
    
    <script src="/static/scripts/wishbasket.js?v=5" defer></script>
    <script>const CATEGORIE_ACTUELLE = "{{ categorie }}";</script>
    <script src="/static/scripts/Categorie.js?v=5" defer></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700;800;900&family=Alex+Brush&display=swap" rel="stylesheet"></head>
</head>
<body>

    <div class="app-frame">
        <nav class="top-nav">
            <div class="nav-logo"><span class="logo-fill">EXP</span><span class="logo-outline">LORA</span></div>
            <div class="nav-links">
                <a href="/">Accueil</a>
                <a href="/makejourney">Créer mon voyage</a>
                <a href="/Destinations" class="active">Catalogue d'activités</a>
                <a href="/topics">Mes voyages</a>
                <a href="/editeur">éditeur</a>
            </div>
            
            <div class="nav-actions">
                <div class="icon-wrapper">
                    <button id="likesIcon" class="action-btn" type="button" title="Mes Favoris">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span id="likesCount" class="badge pink" hidden>0</span>
                    </button>
                    <div id="floatingLikes" class="floating-panel"></div>
                </div>

                <div class="icon-wrapper">
                    <button id="basketIcon" class="action-btn" type="button" title="Panier">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12z"/></svg>
                        <span id="basketCount" class="badge" hidden>0</span>
                    </button>
                    <div id="floatingBasket" class="floating-panel"></div>
                </div>
            </div>
        </nav>

        <div class="content-panel">
            <div class="categorie-inner">
                
                <div class="cat-header fade-in">
                    <a href="/Destinations" class="back-link">← Retour au catalogue</a>
                    <span class="script-decoration">Votre sélection</span>
                    <h1 class="main-title" id="pageTitle">{{ categorie }}</h1>
                </div>

                <div class="activities-list fade-in delay-1" id="activitiesList">
                    <p style="text-align:center; color:#888;">Recherche des meilleures activités en cours...</p>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
