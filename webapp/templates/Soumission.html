<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WishAdventure — Création de voyage</title>
    <link rel="stylesheet" href="/static/styles/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #190028;
            --accent: #FF6000;
            --text: #F9F0F7;
            --text-dim: rgba(249, 240, 247, .70);
            --card: rgba(255, 255, 255, .04);
            --nav-h: 64px;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Poppins, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-frame {
            flex: 1;
            width: 100vw;
            background: var(--bg);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Dégradé de fond */
        .app-frame::before {
            content: "";
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 50% 30%, #3e1e4a 0%, #190028 60%);
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
        }

        .content-panel {
            position: relative;
            z-index: 1;
            padding: 20px 20px calc(var(--nav-h) + 24px) 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex: 1;
            overflow: auto;
            scrollbar-width: thin;
            align-items: center;
        }

        .content-inner {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* Header */
        .header-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-top: 10px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-dim);
            text-align: center;
            margin-top: -10px;
            font-weight: 500;
        }

        /* Formulaire Critères */
        .criteria-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
            background: rgba(255, 255, 255, 0.03);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .criteria-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .criteria-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .criteria-value {
            font-size: 14px;
            color: var(--accent);
            font-weight: 700;
            background: rgba(255, 96, 0, 0.15);
            pxading: 2px 8px;
            border-radius: 6px;
            min-width: 24px;
            text-align: center;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* Chrome/Safari/Edge Track */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
        }

        /* Firefox Track */
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
        }

        /* Chrome/Safari/Edge Thumb */
        input[type=range]::-webkit-slider-thumb {
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -7px;
            box-shadow: 0 0 10px rgba(255, 96, 0, 0.6);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        /* Firefox Thumb */
        input[type=range]::-moz-range-thumb {
            height: 20px;
            width: 20px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 96, 0, 0.6);
            transition: transform 0.1s;
        }

        /* Bouton Soumettre */
        .submit-btn {
            margin-top: 10px;
            background: linear-gradient(135deg, #FF6000 0%, #FF2000 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 96, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 96, 0, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Bottom Nav */
        nav.bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--nav-h);
            display: flex;
            gap: 8px;
            padding: 10px;
            background: rgba(0, 0, 0, .25);
            backdrop-filter: blur(6px);
            border-top: 1px solid rgba(255, 255, 255, .06);
            z-index: 100;
        }

        .boutonNav {
            flex: 1;
            border: none;
            border-radius: 12px;
            padding: 10px 8px;
            background: rgba(255, 255, 255, .06);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .boutonNav.active {
            background: var(--accent);
            color: #190028
        }

        .nav-icon {
            width: 18px;
            height: 18px;
            vertical-align: -3px;
            fill: #fff;
        }
    </style>
</head>

<body>

    <div class="app-frame">
        <div class="content-panel">

            <div class="content-inner">

                <div>
                    <div class="header-title">Création de voyage</div>
                    <div class="subtitle">Choisissez vos critères entre 1 et 10 :</div>
                </div>

                <form class="criteria-form" id="criteriaForm">

                    <!-- Critère: Détente -->
                    <div class="criteria-item">
                        <div class="criteria-label">
                            <span>🧘 Détente</span>
                            <span class="criteria-value" id="val-detente">0</span>
                        </div>
                        <input type="range" id="detente" name="detente" min="0" max="10" value="0"
                            oninput="updateVal('detente')">
                    </div>

                    <!-- Critère: Nature -->
                    <div class="criteria-item">
                        <div class="criteria-label">
                            <span>🌿 Nature</span>
                            <span class="criteria-value" id="val-nature">0</span>
                        </div>
                        <input type="range" id="nature" name="nature" min="0" max="10" value="0"
                            oninput="updateVal('nature')">
                    </div>

                    <!-- Critère: Sport -->
                    <div class="criteria-item">
                        <div class="criteria-label">
                            <span>🏃 Sport</span>
                            <span class="criteria-value" id="val-sport">0</span>
                        </div>
                        <input type="range" id="sport" name="sport" min="0" max="10" value="0"
                            oninput="updateVal('sport')">
                    </div>

                    <!-- Critère: Gastronomie -->
                    <div class="criteria-item">
                        <div class="criteria-label">
                            <span>🍽️ Gastronomie</span>
                            <span class="criteria-value" id="val-gastronomie">0</span>
                        </div>
                        <input type="range" id="gastronomie" name="gastronomie" min="0" max="10" value="0"
                            oninput="updateVal('gastronomie')">
                    </div>

                    <!-- Critère: Culture -->
                    <div class="criteria-item">
                        <div class="criteria-label">
                            <span>🎭 Culture</span>
                            <span class="criteria-value" id="val-culture">0</span>
                        </div>
                        <input type="range" id="culture" name="culture" min="0" max="10" value="0"
                            oninput="updateVal('culture')">
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">
                        Soumettre <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                    </button>

                </form>

            </div>
        </div>

        <nav class="bottom-nav">
            <a href="/" class="bouton"><button class="boutonNav"><svg class="nav-icon" viewBox="0 0 24 24">
                        <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z" />
                    </svg>Accueil</button></a>
            <a href="/Destinations" class="bouton"><button class="boutonNav"><svg class="nav-icon" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="6"></circle>
                        <path d="M20 20l-3.5-3.5" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" />
                    </svg>Exploration</button></a>
            <a href="/topics" class="bouton"><button class="boutonNav"><svg class="nav-icon" viewBox="0 0 24 24">
                        <path d="M5 4h11a2 2 0 0 1 2 2v12H7a2 2 0 0 1-2-2V4z" />
                        <rect x="3" y="6" width="2" height="12" rx="1" ry="1" />
                        <path d="M8 8h7M8 11h7M8 14h5" stroke="white" stroke-width="2" fill="none"
                            stroke-linecap="round" />
                    </svg>Carnet</button></a>
            <a href="/soumission" class="bouton"><button class="boutonNav active"><svg class="nav-icon"
                        viewBox="0 0 24 24">
                        <path
                            d="M12 2a6 6 0 0 0-6 6c0 4.5 6 12 6 12s6-7.5 6-12a6 6 0 0 0-6-6zm0 8.5A2.5 2.5 0 1 1 12 5.5a2.5 2.5 0 0 1 0 5z" />
                        <path d="M15.2 14.2l3.2 3.2-2.3 0.5-1.4 1.4-0.5-2.3 1-1z" />
                    </svg>Création</button></a>
        </nav>
    </div>

    <script>
        function updateVal(id) {
            document.getElementById('val-' + id).textContent = document.getElementById(id).value;
        }

        document.getElementById('criteriaForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = {
                detente: document.getElementById('detente').value,
                nature: document.getElementById('nature').value,
                sport: document.getElementById('sport').value,
                gastronomie: document.getElementById('gastronomie').value,
                culture: document.getElementById('culture').value
            };

            console.log("Critères soumis :", formData);

            // Animation bouton
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "Création en cours...";
            btn.style.opacity = "0.8";

            // Simulation traitement ou redirection
            setTimeout(() => {
                // Redirection vers la page de création/édition classique avec ces préréglages (pour l'instant, juste redirection)
                // Vous pouvez passer ces paramètres en URL ou localStorage
                localStorage.setItem('wish_last_criteria', JSON.stringify(formData));
                window.location.href = '/creation';
            }, 1000);
        });
    </script>

</body>

</html>
