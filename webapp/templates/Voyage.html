<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explora — Votre voyage</title>
    <link rel="stylesheet" href="/static/styles/app.css">
    <link rel="stylesheet" href="/static/styles/Voyage.css?v=3">
    <script src="/static/scripts/Voyage.js?v=4" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@700;900&family=Alex+Brush&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-frame">

        <nav class="top-nav">
            <div class="nav-logo">
                <span class="logo-fill">EXP</span><span class="logo-outline">LORA</span>
            </div>

            <div class="nav-links">
                <a href="/">Accueil</a>
                <a href="/makejourney">Créer mon voyage</a>
                <a href="/Destinations">Catalogue d'activités</a>
                <a href="/topics">Mes voyages</a>
                <a href="/editeur">éditeur</a>
            </div>

            <div class="nav-actions">
                <a href="/makejourney" class="nav-back" title="Retour à la création">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    <span>Modifier</span>
                </a>
            </div>
        </nav>

        <svg class="bg-airplane-line" viewBox="0 0 1000 500" preserveAspectRatio="none">
            <path d="M 0 400 Q 300 100 600 250 T 1000 50" fill="none" stroke="#D4C3B3" stroke-width="2" stroke-dasharray="10 15"/>
        </svg>

        <div class="content-panel">
            <div class="content-inner">

                <header class="voyage-header">
                    <span class="script-decoration">Votre itinéraire</span>
                    <h1 class="main-title">Carnet de voyage</h1>
                    <p class="intro-text" id="voyage-subtitle">
                        Découvrez les étapes imaginées par notre intelligence artificielle selon vos envies. Cliquez sur une activité pour en savoir plus.
                    </p>
                </header>

                <div id="conteneur-itineraire" class="itineraire">
                    <!-- Injecté par Voyage.js -->
                </div>

                <div class="voyage-actions">
                    <a href="/makejourney" class="btn-secondary">← Modifier mes critères</a>
                    <button type="button" class="btn-explorer" id="saveVoyageBtn">Sauvegarder ce voyage</button>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
