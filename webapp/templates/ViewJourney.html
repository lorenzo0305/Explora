<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explora — Détail du voyage</title>

  <link rel="stylesheet" href="/static/styles/app.css">
  <link rel="stylesheet" href="/static/styles/ViewJourney.css?v=2.0"> 
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@700;900&family=Alex+Brush&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-frame">
      
      <nav class="top-nav">
          <div class="nav-logo"><span class="logo-fill">EXP</span><span class="logo-outline">LORA</span></div>
          <div class="nav-links">
              <a href="/">Accueil</a>
              <a href="/makejourney">Créer mon voyage</a>
              <a href="/Destinations">Catalogue d'activités</a>
              <a href="/topics" class="active">Mes voyages</a>
          </div>
      </nav>

      <div class="content-panel">
          
          <div class="journey-hero fade-in">
              <a href="/topics" class="back-link">← Retour au carnet</a>
              <div class="hero-image" style="background-image: url('/static/img/alsace.jpg');"></div>
              <div class="hero-content">
                  <span class="script-decoration">Votre itinéraire</span>
                  <h1 id="journeyTitle" class="main-title">Voyage en Alsace</h1>
                  <p class="journey-meta">3 Jours • 12 Activités</p>
              </div>
          </div>

          <div class="journey-timeline fade-in delay-1">
              
              <div class="timeline-day">
                  <div class="day-marker">Jour 1</div>
                  
                  <div class="timeline-card">
                      <div class="time-slot">09:00</div>
                      <div class="card-content">
                          <h4>Visite de la Cathédrale</h4>
                          <p>Patrimoine Culturel • 2 heures</p>
                      </div>
                  </div>

                  <div class="timeline-card">
                      <div class="time-slot">12:30</div>
                      <div class="card-content">
                          <h4>Déjeuner Winstub Traditionnelle</h4>
                          <p>Gastronomie • Spécialités locales</p>
                      </div>
                  </div>
              </div>

          </div>

      </div>
  </div>

</body>
</html>
