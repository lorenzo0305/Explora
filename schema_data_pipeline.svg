<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- cadre -->
  <rect x="10" y="10" width="880" height="440" fill="#fffdf5" stroke="#222" stroke-width="2" rx="6" ry="6" filter="url(#rough)"/>

  <!-- Nuage DATAtourisme -->
  <g filter="url(#rough)">
    <ellipse cx="110" cy="85" rx="70" ry="30" fill="#ffffff" stroke="#222" stroke-width="2"/>
    <ellipse cx="80" cy="80" rx="30" ry="22" fill="#ffffff" stroke="#222" stroke-width="2"/>
    <ellipse cx="140" cy="70" rx="32" ry="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
  </g>
  <text x="110" y="90" text-anchor="middle" font-size="16" fill="#222">DATAtourisme</text>

  <!-- Flèche flux -->
  <path d="M180 95 C 220 95, 230 120, 260 130" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)" filter="url(#rough)"/>
  <text x="205" y="85" font-size="13" fill="#222">flux</text>

  <!-- JSON brut -->
  <g filter="url(#rough)">
    <rect x="260" y="110" width="150" height="70" fill="#fff5e1" stroke="#222" stroke-width="2" rx="4" ry="4"/>
  </g>
  <text x="335" y="140" text-anchor="middle" font-size="15" fill="#222">Fichier JSON brut</text>
  <text x="335" y="160" text-anchor="middle" font-size="12" fill="#555">(1 par région)</text>

  <!-- Flèche extraction -->
  <path d="M410 145 L 475 145" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)" filter="url(#rough)"/>
  <text x="442" y="138" text-anchor="middle" font-size="12" fill="#222">extraction</text>

  <!-- Script Python : nettoyage -->
  <g filter="url(#rough)">
    <rect x="475" y="105" width="180" height="80" fill="#e6f2ff" stroke="#222" stroke-width="2" rx="4" ry="4"/>
  </g>
  <text x="565" y="130" text-anchor="middle" font-size="15" fill="#222">Script Python</text>
  <text x="565" y="150" text-anchor="middle" font-size="13" fill="#222">nettoyage &amp;</text>
  <text x="565" y="168" text-anchor="middle" font-size="13" fill="#222">normalisation</text>

  <!-- Champs retenus (légende sous le script) -->
  <g filter="url(#rough)">
    <rect x="470" y="200" width="190" height="80" fill="#fffdf5" stroke="#222" stroke-width="1.5" stroke-dasharray="5,3" rx="4" ry="4"/>
  </g>
  <text x="565" y="218" text-anchor="middle" font-size="12" fill="#222">champs retenus :</text>
  <text x="480" y="236" font-size="12" fill="#222">• nom, description</text>
  <text x="480" y="252" font-size="12" fill="#222">• GPS, adresse, contact</text>
  <text x="480" y="268" font-size="12" fill="#222">• site internet</text>
  <path d="M565 185 L 565 200" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="3,3" filter="url(#rough)"/>

  <!-- Flèche vers mapping -->
  <path d="M655 145 L 720 145" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)" filter="url(#rough)"/>

  <!-- Mapping @type -->
  <g filter="url(#rough)">
    <rect x="720" y="105" width="160" height="80" fill="#eaf7e6" stroke="#222" stroke-width="2" rx="4" ry="4"/>
  </g>
  <text x="800" y="128" text-anchor="middle" font-size="14" fill="#222">Mapping @type</text>
  <text x="800" y="148" text-anchor="middle" font-size="12" fill="#222">~300 types</text>
  <text x="800" y="165" text-anchor="middle" font-size="12" fill="#222">→ 6 catégories</text>
  <text x="800" y="180" text-anchor="middle" font-size="11" fill="#555">(multi-classe)</text>

  <!-- 6 catégories listées -->
  <g filter="url(#rough)">
    <rect x="705" y="200" width="190" height="80" fill="#fffdf5" stroke="#222" stroke-width="1.5" stroke-dasharray="5,3" rx="4" ry="4"/>
  </g>
  <text x="800" y="220" text-anchor="middle" font-size="12" fill="#222">Nature • Culture</text>
  <text x="800" y="240" text-anchor="middle" font-size="12" fill="#222">Gastronomie • Sport</text>
  <text x="800" y="260" text-anchor="middle" font-size="12" fill="#222">Détente • Boutique</text>
  <path d="M800 185 L 800 200" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="3,3" filter="url(#rough)"/>

  <!-- Flèche descendante du mapping vers JSON propre -->
  <path d="M800 280 C 800 310, 700 310, 600 330" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)" filter="url(#rough)"/>

  <!-- JSON propre -->
  <g filter="url(#rough)">
    <rect x="430" y="320" width="180" height="70" fill="#fff5e1" stroke="#222" stroke-width="2" rx="4" ry="4"/>
  </g>
  <text x="520" y="350" text-anchor="middle" font-size="15" fill="#222">JSON épuré</text>
  <text x="520" y="370" text-anchor="middle" font-size="12" fill="#555">(multi-classe + GPS)</text>

  <!-- Flèche injection -->
  <path d="M430 355 L 340 355" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)" filter="url(#rough)"/>
  <text x="385" y="348" text-anchor="middle" font-size="12" fill="#222">injection</text>

  <!-- Nuage MongoDB Atlas -->
  <g filter="url(#rough)">
    <ellipse cx="240" cy="360" rx="75" ry="32" fill="#ffffff" stroke="#222" stroke-width="2"/>
    <ellipse cx="205" cy="353" rx="30" ry="22" fill="#ffffff" stroke="#222" stroke-width="2"/>
    <ellipse cx="275" cy="345" rx="32" ry="22" fill="#ffffff" stroke="#222" stroke-width="2"/>
  </g>
  <text x="240" y="360" text-anchor="middle" font-size="14" fill="#222">MongoDB</text>
  <text x="240" y="378" text-anchor="middle" font-size="14" fill="#222">Atlas (Cloud)</text>

  <!-- Planificateur -->
  <g filter="url(#rough)">
    <rect x="40" y="215" width="130" height="60" fill="#fde8f0" stroke="#222" stroke-width="2" rx="4" ry="4"/>
  </g>
  <text x="105" y="240" text-anchor="middle" font-size="13" fill="#222">Planificateur</text>
  <text x="105" y="258" text-anchor="middle" font-size="13" fill="#222">de tâches</text>

  <!-- flèche planificateur -> script (automatisation) -->
  <path d="M170 235 C 320 190, 420 160, 475 135" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" filter="url(#rough)"/>
  <text x="260" y="185" font-size="12" fill="#222" font-style="italic">automatisation</text>

  <!-- Utilisateurs équipe en bas à droite -->
  <g filter="url(#rough)">
    <circle cx="740" cy="360" r="14" fill="#ffffff" stroke="#222" stroke-width="2"/>
    <path d="M740 374 L 740 405 M726 390 L 754 390 M740 405 L 728 425 M740 405 L 752 425" stroke="#222" stroke-width="2" fill="none"/>
  </g>
  <text x="800" y="370" font-size="13" fill="#222">Équipe Algo /</text>
  <text x="800" y="388" font-size="13" fill="#222">Front / Back</text>

  <!-- flèche MongoDB -> équipe -->
  <path d="M305 360 C 500 400, 650 395, 725 375" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)" filter="url(#rough)"/>
  <text x="520" y="415" text-anchor="middle" font-size="12" fill="#222" font-style="italic">accès centralisé en temps réel</text>

  <!-- Titre -->
  <text x="450" y="38" text-anchor="middle" font-size="20" fill="#222" font-weight="bold">Pipeline Data — du flux DATAtourisme à MongoDB Atlas</text>
</svg>
